# Publishing, via Changesets.
#
# Replaces three semantic-release setups. semantic-release derived the release
# from the squashed commit title, which is why the repo needed pr-title.yml to
# police it; here the intent lives in a committed .changeset/*.md file instead,
# so a mistyped title can no longer decide whether something ships.
#
# On every push to main this opens (or updates) a "Version Packages" pull
# request containing the version bumps and changelog entries. Merging that PR
# is what actually publishes: the next run finds no pending changesets, so
# `changeset publish` pushes the built packages to npm and creates one git tag
# per released package.
#
# `beta` is the prerelease line and runs the same way. Note that this trigger
# has to be listed here, on the default branch: GitHub reads a `workflow_run`
# workflow from the default branch, so editing this file on `beta` alone has no
# effect and the release simply never fires.
#
# It has to publish from CI rather than a laptop for a concrete reason: `@meonode/ui` and
# `@meonode/compiler` set `publishConfig.provenance`, and npm can only mint an
# attestation from a provider it recognises. Publishing them locally fails with
# "Automatic provenance generation not supported for provider: null" — after
# `@meonode/mui`, which sets no provenance, has already gone out. `release:dry`
# exists to catch exactly that before it happens.
#
# Triggered by CI finishing rather than by the push itself. The three
# per-repository workflows this replaced each kept their checks and their
# release in one file, so `needs:` gated publishing on the whole suite;
# splitting checks into ci.yml would have dropped that gate and let a push
# publish while its own tests were still running, or after they had failed.
# `workflow_run` restores it — nothing here starts until CI reports success
# for that commit.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, beta]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Changesets commits the version bump, which fires the pre-commit hook, which
  # runs the lint and unit suites — inside a job that has no reason to install
  # the RSC fixture's dependencies, so linting fails on an unresolvable import
  # and the release dies after building everything successfully. The hook is a
  # local-dev guard against pushing something broken; by the time this workflow
  # runs, CI has already run those same suites properly as their own jobs.
  HUSKY: 0

jobs:
  release:
    name: Version or publish
    # A failed or cancelled CI run still fires `workflow_run`, so the
    # conclusion has to be checked explicitly.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: Production
    env:
      # Read here because `secrets` is not available in `if` expressions.
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
    permissions:
      contents: write
      pull-requests: write
      # Required for npm trusted publishing (OIDC). Without it npm falls back
      # to looking for a token and the publish fails.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # `workflow_run` checks out the default branch by default, not the
          # commit that triggered CI. Releasing a different tree than the one
          # CI approved is the whole thing this trigger exists to prevent.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a modern npm; the one bundled with Node LTS
      # can lag behind the version that learned to mint OIDC credentials.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler

      - run: bun install --frozen-lockfile

      # The wasm artifact is gitignored and rebuilt here, so the published
      # @meonode/compiler always carries a plugin built from this commit.
      - name: Build all packages
        run: bun run build

      - name: Verify provenance attestations
        run: npm audit signatures

      # Runs here rather than in ci.yml on purpose: it checks whether *this*
      # environment can mint a provenance attestation, so it is only meaningful
      # in the job that actually publishes. `npm publish --dry-run` does not
      # check that — it packs the tarball and reports success regardless — which
      # is how a release once published one package and failed the other two.
      - name: Dry-run the release
        run: bun run release:dry

      # ─── Why this token is not `GITHUB_TOKEN` ────────────────────────────
      #
      # GitHub does not start workflow runs for events created with the default
      # `GITHUB_TOKEN`. That is a loop-prevention rule and it cannot be
      # configured away.
      #
      # The consequence is specific and easy to misread: the "version packages"
      # PR this step opens gets **no checks at all**. `main` requires fifteen,
      # none of them can ever report on that PR, and branch protection can never
      # be satisfied — so the release PR is unmergeable and the only ways
      # through are `--admin`, which merges a release with none of its checks
      # having run on the versioned tree, or pushing an empty commit by hand to
      # produce a `synchronize` event from a real actor.
      #
      # A PAT (or a GitHub App token) is a real actor, so its PR triggers the
      # checks normally. `RELEASE_PAT` needs `repo` and `workflow` scope and
      # must be allowed to push to `changeset-release/*`.
      #
      # The fallback keeps the workflow working without the secret rather than
      # failing obscurely — but a release opened under it needs the manual
      # nudge, which the guard below says out loud instead of leaving someone
      # to rediscover it.
      - name: Warn when the release PR will have no checks
        # `secrets` is not available in an `if` expression -- it evaluates empty,
        # so testing it there produces a guard that never fires. The job env
        # below is where the secret is readable.
        if: env.HAS_RELEASE_PAT != 'true'
        run: |
          echo "::warning title=Release PR will have no checks::RELEASE_PAT is not set, so the version PR is opened by GITHUB_TOKEN and GitHub will not start its workflows. It cannot satisfy branch protection until someone pushes a commit to changeset-release/main from a real account."

      - uses: changesets/action@v1.9.0
        with:
          version: bun run version
          publish: bun run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
