# Validates that a pull request title follows Conventional Commits.
#
# This used to be load-bearing: under semantic-release, and with the repository
# set to `squash_merge_commit_title: PR_TITLE`, the PR title *became* the commit
# on main and therefore decided whether a release happened and what kind. A
# title like "update stuff" silently produced no release; a stray `feat:`
# produced one nobody intended.
#
# Changesets took that job away — what ships is now decided by the committed
# .changeset/*.md files, which are reviewable in the diff rather than inferred
# from a title. The check is kept for the smaller thing it still does well:
# a readable, uniformly prefixed history on main.
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check title against Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Mirrors the angular preset semantic-release uses via
          # @semantic-release/commit-analyzer. `feat` and `fix` release;
          # `perf` releases a patch; the rest do not.
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert
          requireScope: false
          # A single-commit PR can still be squashed under its commit title in
          # some flows, so do not assume the title is the only thing checked.
          validateSingleCommit: false
