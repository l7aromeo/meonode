# Single CI workflow for the whole monorepo.
#
# Replaces three per-repo workflows (meonode-ui's release.yml checks,
# meonode-compiler's ci.yml, meonode-mui's release.yml checks). Publishing
# lives in release.yml; this file only decides whether the tree is sound.
#
# Every job is gated on the `changes` job below, so touching a mui wrapper
# does not spend eight minutes rebuilding the Rust plugin and replaying the
# RSC fixtures. `paths-filter` is evaluated per job rather than at the
# workflow level because `on.push.paths` would skip the entire workflow, and
# a skipped workflow reports no status at all — which branch protection reads
# as "check missing", not "check passed".
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every `bun install` below would otherwise re-install the git hooks through
  # the root `prepare` script. Nothing here commits, so they would not fire —
  # but the jobs in this file *are* what the hooks exist to approximate, so
  # installing them is pointless work at best.
  HUSKY: 0

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      mui: ${{ steps.filter.outputs.mui }}
      compiler: ${{ steps.filter.outputs.compiler }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `root` entries are repeated into every package rather than kept as
          # their own output: a change to the root lockfile or workspace layout
          # can alter what any package resolves, so it has to run everything.
          filters: |
            root: &root
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.github/workflows/ci.yml'
            ui:
              - *root
              - 'packages/ui/**'
              - 'packages/compiler/**'
            mui:
              - *root
              - 'packages/mui/**'
              - 'packages/ui/**'
            compiler:
              - *root
              - 'packages/compiler/**'
              - 'packages/ui/src/constant/css-properties.const.ts'
              - 'packages/ui/scripts/export-css-properties.ts'

  # Built once and shared. Without this, every job that needs the plugin
  # (ui compiled tests, e2e) would install the Rust toolchain and rebuild it.
  wasm:
    name: Build wasm plugin
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:compiler
      - uses: actions/upload-artifact@v7
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm/meonode_swc_plugin.wasm
          retention-days: 1

  # Under semantic-release a change that shipped nothing was indistinguishable
  # from one that simply had a vague title. Here the intent is explicit, so it
  # can be checked: a pull request that changes what a package publishes must
  # say what release it wants, in a changeset naming that package. A change that
  # publishes nothing (a devDependency, a test, a build script) needs none.
  # Two branches are exempt, for the same underlying reason: both carry version
  # bumps rather than source changes, which is exactly the shape this job is
  # built to reject.
  #
  # The version pull request. `changesets/action` opens it to *apply* the
  # changesets: it bumps every package they name and deletes the changeset files
  # in the same commit, so by construction it changes packages and carries no
  # changeset. The branch name is `changeset-release/<base>`, the action's
  # default.
  #
  # The `beta` prerelease line, when it merges back. Versioning happens on that
  # branch, so by the time it targets `main` a package can differ only by its
  # `version` field and CHANGELOG entry — `@meonode/mui` did, on the 2.0 merge,
  # having been majored solely because `@meonode/ui` is a peer dependency taken
  # out of range. Demanding a changeset there would bump it a second time on top
  # of the release it is already carrying.
  #
  # Skipping is safe for branch protection, which reads a skipped job as
  # satisfied (an entirely skipped *workflow* is what reports nothing at all;
  # see the note at the top of this file).
  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') && github.head_ref != 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:scripts
      # Fails when what a package publishes changed and no changeset on the
      # branch names that package. `changeset status` is not run: it counts any
      # file under a package's directory, so it would demand a changeset for a
      # devDependency bump or a test fixture, which ship nothing.
      - run: bun run check:changesets origin/${{ github.base_ref }}

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.mui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # mui's `tsc --noEmit` imports @meonode/ui, which resolves through ui's
      # exports map to packages/ui/dist — a directory that does not exist in a
      # fresh checkout. Linking the workspace package is not enough; it has to
      # be built.
      - run: bun run build:ui
      # The RSC fixture is deliberately outside the workspace, so its imports
      # only typecheck once it has its own node_modules.
      - run: bun run --filter @meonode/ui prepare:rsc-fixture
      - run: bun run lint

  ui-test:
    name: Test (ui, ${{ matrix.mode }})
    needs: [changes, wasm]
    # This job must RUN even when there is nothing to test, because its name is
    # a required status check and a matrix job that is skipped reports its name
    # unexpanded -- `Test (ui, ${{ matrix.mode }})` rather than `Test (ui, plain)`.
    # The required contexts then never report at all and the PR is unmergeable,
    # which is what happens to any change that touches no package. The work is
    # skipped step by step instead, so the contexts report and cost nothing.
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, compiled]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.ui == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.ui == 'true'
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.ui == 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.ui == 'true'
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.ui == 'true'
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
      - run: bun run --filter @meonode/ui ${{ matrix.mode == 'compiled' && 'test:compiled' || 'test' }}
        if: needs.changes.outputs.ui == 'true'

  ui-rsc:
    name: Test (RSC, ${{ matrix.mode }})
    needs: [changes, wasm]
    # This job must RUN even when there is nothing to test, because its name is
    # a required status check and a matrix job that is skipped reports its name
    # unexpanded -- `Test (RSC, ${{ matrix.mode }})` rather than `Test (RSC, plain)`.
    # The required contexts then never report at all and the PR is unmergeable,
    # which is what happens to any change that touches no package. The work is
    # skipped step by step instead, so the contexts report and cost nothing.
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, compiled]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.ui == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.ui == 'true'
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.ui == 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.ui == 'true'
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.ui == 'true'
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
      - run: bunx playwright install --with-deps chromium
        if: needs.changes.outputs.ui == 'true'
      - run: bun run --filter @meonode/ui ${{ matrix.mode == 'compiled' && 'test:rsc:compiled' || 'test:rsc' }}
        if: needs.changes.outputs.ui == 'true'

  cargo:
    name: Cargo test
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler
      - run: cargo test --manifest-path packages/compiler/Cargo.toml --workspace

  wasm-smoke:
    name: WASM smoke
    needs: [changes, wasm]
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
      # The equivalence suites import @meonode/ui, which resolves to
      # packages/ui/dist — built here rather than assumed present.
      - run: bun run build:ui
      # Loads the built artifact through @swc/core's real plugin host, which
      # proves the crate's swc_core ABI matches @swc/core's — something
      # `cargo build` alone cannot show.
      - run: bun run --filter @meonode/compiler-repo test

  # The plugin and its host have to share swc's AST generation; a mismatch fails
  # the build (see the compiler README's Version compatibility). Each entry loads
  # one plugin build in one @swc/core: this checkout on the line it serves,
  # including the latest @swc/core so a new generation fails here first, and the
  # published 0.9.0 on the older line it still serves.
  host-compat:
    name: Host compat (${{ matrix.plugin }} on @swc/core ${{ matrix.swc }})
    needs: [changes, wasm]
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: this checkout, swc: 1.16.0 }
          - { plugin: this checkout, swc: latest }
          - { plugin: 0.9.0, swc: 1.15.47, published: true }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
      - name: Install the host
        working-directory: ${{ runner.temp }}
        run: |
          mkdir host && cd host
          echo '{ "private": true }' > package.json
          bun add "@swc/core@${{ matrix.swc }}" ${{ matrix.published && format('@meonode/compiler@{0}', matrix.plugin) || '' }}
      - run: bunx vitest run tests/host-compat.test.ts
        working-directory: packages/compiler
        env:
          MEONODE_SWC_HOST: ${{ runner.temp }}/host
          MEONODE_PLUGIN_WASM: ${{ matrix.published && format('{0}/host/node_modules/@meonode/compiler/meonode_swc_plugin.wasm', runner.temp) || '' }}

  css-drift:
    name: CSS prop + factory drift
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Previously this job checked out l7aromeo/meonode-ui@main as a sibling
      # directory, so the generated Rust tables were validated against ui's
      # default branch rather than against the ui in the same change. In the
      # monorepo the codegen reads packages/ui directly and the two can no
      # longer disagree.
      - run: bun run check:drift
      # The compiler's test sources import @meonode/ui, which resolves to
      # packages/ui/dist — built here rather than assumed present.
      - run: bun run build:ui
      # Vitest strips types without checking them, so nothing else notices a
      # type error in the codegen or test sources.
      - run: bun run typecheck

  e2e:
    name: E2E fixtures (Next + Vite)
    needs: [changes, wasm]
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
      - run: bun run test:e2e

  # The same fixtures on hosts the lockfiles do not pin: the latest Next,
  # @vitejs/plugin-react-swc and @swc/core, so a new host generation fails CI
  # before it reaches users; and the published 0.9.0 on Next 16.3.8 and
  # @swc/core 1.15.47, the older line it still serves, against this checkout's
  # @meonode/ui.
  e2e-hosts:
    name: E2E hosts (${{ matrix.name }})
    needs: [changes, wasm]
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: this checkout on the latest hosts
            latest: '1'
          - name: 0.9.0 on Next 16.3.8 and @swc/core 1.15.47
            compiler: 0.9.0
            next: 16.3.8
            swc: 1.15.47
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
      - run: bun run test:e2e
        env:
          MEONODE_E2E_LATEST: ${{ matrix.latest }}
          MEONODE_E2E_COMPILER: ${{ matrix.compiler }}
          MEONODE_E2E_NEXT: ${{ matrix.next }}
          MEONODE_E2E_SWC: ${{ matrix.swc }}

  mui-generated-sync:
    name: mui generated files in sync
    needs: changes
    if: needs.changes.outputs.mui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The generator typechecks the wrappers it emits, and they import
      # @meonode/ui — so ui has to be built before it runs.
      - run: bun run build:ui
      - run: bun run --filter @meonode/mui generate:lib
      - name: Ensure generated files and generator caches are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  build:
    name: Build
    needs: [changes, wasm]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: meonode-swc-plugin
          path: packages/compiler/npm
        continue-on-error: true
      - run: bun run build:ui && bun run build:mui
