[workspace]
resolver = "2"
members = ["crates/meonode-swc-plugin"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/l7aromeo/meonode/tree/main/packages/compiler"
# The highest rust-version among the locked dependencies (uuid).
rust-version = "1.89"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# The parser and the resolver run only with `callSiteLocations`, a development
# option, to read the author's file (src/positions.rs), so they are optimized
# for size.
[profile.release.package.swc_ecma_parser]
opt-level = "z"

[profile.release.package.swc_ecma_transforms_base]
opt-level = "z"
