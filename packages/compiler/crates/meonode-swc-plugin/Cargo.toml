[package]
name = "meonode-swc-plugin"
description = "SWC WASM plugin that rewrites @meonode/ui call sites into pre-partitioned marker props"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swc_core = { version = "84", features = ["ecma_plugin_transform", "ecma_parser", "ecma_parser_typescript", "ecma_transforms"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
regex-lite = "0.1.9"

[dev-dependencies]
swc_core = { version = "84", features = ["testing_transform", "ecma_parser"] }

# Compiles to a single .wasm plugin binary consumed by:
#   - Next.js (Turbopack/webpack) via experimental.swcPlugins
#   - Vite via @vitejs/plugin-react-swc's `plugins` option
# Target: wasm32-wasip1 (see rust-toolchain.toml). Never wasm32-unknown-unknown —
# the swc plugin host (swc_plugin_runner) expects a WASI module.
